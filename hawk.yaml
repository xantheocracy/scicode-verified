name: scicode-verified-luna-smoke

# Use the branch so dependency fixes are picked up after pushing.
# For reproducible runs, replace inspect-wrapper with the published commit SHA.
tasks:
  - package: git+https://github.com/xantheocracy/scicode-verified.git@inspect-wrapper
    name: scicode_inspect
    items:
      - name: scicode_verified
        args:
          #provide_scientific_background: true
          download_targets: true
          grading_environments: both
          timeout: 1800

models:
  - package: openai
    name: openai
    items:
      - name: gpt-6-luna

#limit: 1
epochs: 1
retry_attempts: 0
max_retries: 3

runner:
  cpu: "2"
  memory: 4Gi
