<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">SciCode-Verified release pipeline</title>
  <desc id="desc">Four stages: audit, trace, rebuild, and verify, ending in the version 2 release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061425"/>
      <stop offset="1" stop-color="#0c2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48d5d0"/>
      <stop offset="1" stop-color="#f2645a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4f718c"/>
    </marker>
  </defs>

  <rect width="1600" height="360" rx="28" fill="url(#bg)"/>
  <path d="M0 300 C250 235 350 365 610 300 S980 250 1220 300 S1450 345 1600 275"
        fill="none" stroke="#48d5d0" stroke-opacity=".10" stroke-width="2"/>
  <path d="M0 320 C280 255 390 385 640 320 S1010 270 1250 320 S1480 365 1600 295"
        fill="none" stroke="#f2645a" stroke-opacity=".10" stroke-width="2"/>

  <g stroke="#4f718c" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M370 155 H430"/>
    <path d="M760 155 H820"/>
    <path d="M1150 155 H1210"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(50 58)">
      <rect width="320" height="194" rx="20" fill="#102b44" stroke="#244a67"/>
      <circle cx="46" cy="44" r="24" fill="#48d5d0"/>
      <text x="46" y="51" text-anchor="middle" fill="#061425" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="800">01</text>
      <text x="84" y="51" fill="#f7fbff" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="800" letter-spacing="1.5">AUDIT</text>
      <text x="28" y="110" fill="#f7fbff" font-family="Inter,system-ui,sans-serif" font-size="30" font-weight="800">64 problems</text>
      <text x="28" y="144" fill="#9cb3c6" font-family="Inter,system-ui,sans-serif" font-size="18">reviewed step by step</text>
      <text x="28" y="171" fill="#9cb3c6" font-family="Inter,system-ui,sans-serif" font-size="18">by humans and agents</text>
    </g>

    <g transform="translate(440 58)">
      <rect width="320" height="194" rx="20" fill="#102b44" stroke="#244a67"/>
      <circle cx="46" cy="44" r="24" fill="#65c9f3"/>
      <text x="46" y="51" text-anchor="middle" fill="#061425" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="800">02</text>
      <text x="84" y="51" fill="#f7fbff" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="800" letter-spacing="1.5">TRACE</text>
      <text x="28" y="110" fill="#f7fbff" font-family="Inter,system-ui,sans-serif" font-size="30" font-weight="800">264 corrections</text>
      <text x="28" y="144" fill="#9cb3c6" font-family="Inter,system-ui,sans-serif" font-size="18">recorded in an explicit</text>
      <text x="28" y="171" fill="#9cb3c6" font-family="Inter,system-ui,sans-serif" font-size="18">decision ledger</text>
    </g>

    <g transform="translate(830 58)">
      <rect width="320" height="194" rx="20" fill="#102b44" stroke="#244a67"/>
      <circle cx="46" cy="44" r="24" fill="#a5a8ff"/>
      <text x="46" y="51" text-anchor="middle" fill="#061425" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="800">03</text>
      <text x="84" y="51" fill="#f7fbff" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="800" letter-spacing="1.5">REBUILD</text>
      <text x="28" y="110" fill="#f7fbff" font-family="Inter,system-ui,sans-serif" font-size="30" font-weight="800">One source of truth</text>
      <text x="28" y="144" fill="#9cb3c6" font-family="Inter,system-ui,sans-serif" font-size="18">JSONL + HDF5 + manifest</text>
      <text x="28" y="171" fill="#9cb3c6" font-family="Inter,system-ui,sans-serif" font-size="18">derived reproducibly</text>
    </g>

    <g transform="translate(1220 58)">
      <rect width="330" height="194" rx="20" fill="#102b44" stroke="#f2645a" stroke-opacity=".7"/>
      <circle cx="46" cy="44" r="24" fill="#f2645a"/>
      <text x="46" y="51" text-anchor="middle" fill="#ffffff" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="800">04</text>
      <text x="84" y="51" fill="#f7fbff" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="800" letter-spacing="1.5">VERIFY</text>
      <text x="28" y="110" fill="#f7fbff" font-family="Inter,system-ui,sans-serif" font-size="30" font-weight="800">Two environments</text>
      <text x="28" y="144" fill="#9cb3c6" font-family="Inter,system-ui,sans-serif" font-size="18">scientific-Python drift</text>
      <text x="28" y="171" fill="#9cb3c6" font-family="Inter,system-ui,sans-serif" font-size="18">handled by pass-if-any</text>
    </g>
  </g>

  <rect x="540" y="292" width="520" height="40" rx="20" fill="url(#accent)"/>
  <text x="800" y="318" text-anchor="middle" fill="#061425" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="850" letter-spacing=".6">
    v2 RELEASE  ·  64 PROBLEMS  ·  287 SCORED SUBPROBLEMS
  </text>
</svg>
